# Blueprint de Render para SERVIPLACE (serviplace.cl)
# En Render: New + > Blueprint > repo GoGo-DevS/serviplace.
# Los valores marcados "sync: false" se pegan a mano en el dashboard: son
# secretos y nunca viven en el repo.
#
# BASE DE DATOS: Neon (cuenta gratis), proyecto "serviplace", región AWS
# us-east-1 — la misma zona que el servicio (virginia), para que cada consulta
# no cruce el continente.
# IMÁGENES: Cloudflare R2, bucket "serviplace", servido en media.serviplace.cl.
# La guarda de settings.py exige las 5 variables R2_* o ninguna.
#
# Primer deploy: build.sh carga los 361 prestadores (solo si la base está
# vacía) y crea el admin desde DJANGO_SUPERUSER_* (solo si no existe).

services:
  - type: web
    name: serviplace
    runtime: python
    plan: free
    region: virginia
    branch: main
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"          # → DEBUG=False, activa WhiteNoise
      - key: WEB_CONCURRENCY
        value: "2"             # el plan free tiene 512 MB
      - key: ALLOWED_HOSTS
        value: "serviplace.cl,www.serviplace.cl"   # Render suma solo su *.onrender.com
      - key: SITE_URL
        value: "https://serviplace.cl"
      - key: ADMIN_URL
        sync: false            # ruta secreta del admin, ej. panel-xxxxxxxx
      - key: DATABASE_URL
        sync: false            # cadena de Neon (postgresql://...?sslmode=require)
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: "serviplace"
      - key: R2_ENDPOINT
        sync: false            # https://<account_id>.r2.cloudflarestorage.com
      - key: R2_PUBLIC_URL
        value: "https://media.serviplace.cl"
      - key: GA4_MEASUREMENT_ID
        value: "G-RLX75T8KGM"         # propiedad ServiPlace (559460692); vacío = no se mide
      - key: CONTACT_EMAIL
        value: "contacto@serviplace.cl"
      - key: DEFAULT_CONTACT_WHATSAPP
        value: "56956392509"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "diego"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "contacto@serviplace.cl"
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false            # solo se usa al crear el admin la primera vez
